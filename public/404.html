<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA redirect: preserve path, query, and hash
      // by encoding the current URL into the query string, then
      // letting the app router decode it on load.
      var location = window.location;
      var segmentCount = 1; // set to 0 for a user org page (username.github.io)
      var query =
        "?/" +
        location.pathname
          .slice(1)
          .split("/")
          .slice(segmentCount)
          .join("/")
          .replace(/&/g, "~and~") +
        (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
        location.hash;
      location.replace(
        location.protocol +
          "//" +
          location.hostname +
          (location.port ? ":" + location.port : "") +
          location.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          query
      );
    </script>
  </head>
  <body></body>
</html>
