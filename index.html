<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jira Time Tracker</title>
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing.
      // 404.html redirects e.g. /jira-time-tracker/callback?code=xxx
      // to /jira-time-tracker/?/callback~and~code=xxx
      // This script converts it back before React boots.
      (function () {
        var search = window.location.search;
        if (search.length > 1 && search.charAt(1) === "/") {
          // Decode: '?/callback~and~state=x~and~code=y' -> '/callback?state=x&code=y'
          var decoded = search
            .slice(2) // remove '?/'
            .replace(/~and~/g, "&");
          var qIdx = decoded.indexOf("&");
          var path, query;
          if (qIdx === -1) {
            path = "/" + decoded;
            query = "";
          } else {
            path = "/" + decoded.slice(0, qIdx);
            query = "?" + decoded.slice(qIdx + 1);
          }
          // Prepend the repo base path (first segment of current pathname)
          var base = window.location.pathname.split("/").slice(0, 2).join("/");
          window.history.replaceState(
            null,
            null,
            base + path + query + window.location.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
